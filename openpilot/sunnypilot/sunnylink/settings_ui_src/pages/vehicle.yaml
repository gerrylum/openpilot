# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: rivian
  title: Rivian Settings
  description: ''
  items:
  - key: RivianR1SWheelbase
    widget: toggle
    title: I Drive an R1S
    description: The R1S and R1T have different wheelbases (3.08 m and 3.45 m), and currently openpilot can't tell them apart. It assumes an R1T by default. Turn this on if you drive an R1S so steering calculations use the correct wheelbase. Can only be changed while not driving; takes effect on your next drive.
    enablement:
    - $ref: '#/macros/offroad'
  - key: RivianOfftrackCompensationEnabled
    widget: toggle
    title: Off-Tracking Compensation
    description: On tight turns the rear wheels follow a smaller arc than the front, which can lead to curb strikes at sharp intersections. This widens the commanded turn slightly to compensate, based on your vehicle's wheelbase. It's a geometric estimate, not curb detection. Works on both the R1T and R1S; the longer R1T benefits more. Can only be changed while not driving.
    enablement:
    - $ref: '#/macros/offroad'
    sub_items:
    - key: RivianOfftrackCompensationGain
      widget: option
      title: Compensation Gain
      description: 'How much to compensate: 0 = none, 1 = full geometric correction. The default is 0.5. R1S owners should turn on "I Drive an R1S" so the correct wheelbase is used, and may prefer a lower setting.'
      min: 0.0
      max: 1.0
      step: 0.05
      enablement:
      - type: param
        key: RivianOfftrackCompensationEnabled
        equals: true
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaMadsScreenButton
    widget: multiple_button
    title: MADS Screen Activation
    description: 'Use a multi-finger press on the infotainment screen to toggle MADS.
      This allows the use of full MADS functionality when enabled. Selecting a higher
      finger count may reduce accidental activations. Note: Setting this to Off will
      reset your MADS settings to default.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 3-Finger
    - value: 2
      label: 4-Finger
    - value: 3
      label: 5-Finger
    visibility:
    - type: capability
      field: tesla_has_vehicle_bus
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: sunnypilot will not take over control of gas and brakes. Factory Toyota longitudinal control will be used.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: sunnypilot will allow some Toyota/Lexus cars to auto resume during stop and go traffic. This feature is only
      applicable to certain models that are able to use longitudinal control. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
